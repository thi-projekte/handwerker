camunda.bpm:
  history-level: audit
  authorization:
    enabled: false
  filter:
    create: All tasks
  deployment-resource-pattern: classpath*:processes/**/*.bpmn
spring:
  jersey:
    application-path: /engine-rest
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://id-craftvoice.winfprojekt.de/realms/handwerker-realm
logging:
  level:
    root: INFO

# Metrics & Health
management:
  endpoint.health.probes.enabled: true
  endpoints:
    web.exposure.include: env,health,info,metrics