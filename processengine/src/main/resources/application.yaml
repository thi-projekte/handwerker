camunda.bpm:
  history-level: audit
  authorization:
    enabled: false
  admin-user:
    id: admin
    password: admin
  webapp:
    jwt:
      secret: supersafesecret
  filter:
    create: All tasks
  deployment-resource-pattern: classpath*:processes/**/*.bpmn
spring:
  jersey:
    application-path: /engine-rest

logging:
  level:
    root: INFO

# Metrics & Health
management:
  endpoint.health.probes.enabled: true
  endpoints:
    web.exposure.include: env,health,info,metrics

mail service:
  base-url: http://localhost:8081