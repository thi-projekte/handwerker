name: Backend CI

on:
  push:
    branches:
      - main
      - 'sprint*'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - 'sprint*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [offer-service]

    steps:
      # Repository herunterladen
      - name: Checkout code
        uses: actions/checkout@v4

      # JDK 21 installieren
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: backend/services/${{ matrix.service }}/pom.xml

      - name: Build with Maven
        run: |
          cd backend/services/${{ matrix.service }}
          mvn clean package

      # Buildx aktivieren
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login in GHCR
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Metadaten für Docker-Tags extrahieren
      - name: Extract metadata for ${{ matrix.service }}
        id: meta
        if: github.event_name == 'push'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=sha-

      # Docker-Image bauen und pushen
      - name: Build and push Docker image for ${{ matrix.service }}
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: backend/services/${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

          cache-from: type=gha
          cache-to: type=gha,mode=max