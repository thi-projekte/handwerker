name: Backend CI

on:
  push:
    branches:
      - main
      - 'sprint*'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - 'sprint*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [db-service, service-a, service-b, service-c]

    steps:
      # Repository herunterladen
      - name: Checkout code
        uses: actions/checkout@v4

      # JDK 21 installieren
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Maven-Build ausführen
      - name: Build with Maven
        run: |
          cd backend/services/${{ matrix.service }}
          mvn clean compile

      # Tests ausführen
      - name: Run tests
        run: |
          cd backend/services/${{ matrix.service }}
          mvn test

      # Artefakt packen
      - name: Package
        run: |
          cd backend/services/${{ matrix.service }}
          mvn package -DskipTests

      # Bei Push: Login in GHCR
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Metadaten für Docker-Tags extrahieren
      - name: Extract metadata for ${{ matrix.service }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=raw,value=1.0.0
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      # Docker-Image bauen und pushen
      - name: Build and push Docker image for ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: backend/services/${{ matrix.service }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
