name: Process Engine CI

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - 'sprint*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  build-process-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'EOF'
          <settings>
            <servers>
              <server>
                <id>mvn-cibseven-enterprise</id>
                <username>${{ secrets.CIBSEVEN_USERNAME }}</username>
                <password>${{ secrets.CIBSEVEN_PASSWORD }}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Build with Maven
        working-directory: ./processengine
        run: mvn clean package -DskipTests

#      - name: Set up Docker Buildx
#        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Build Process Image
        uses: docker/build-push-action@v6
        with:
          context: ./processengine
          file: ./processengine/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/processes:${{ github.sha }}