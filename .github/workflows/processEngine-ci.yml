name: Process Engine CI

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - 'sprint*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  build-process-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Process Image
        uses: docker/build-push-action@v6
        with:
          context: ./processengine
          file: ./processengine/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/processes:${{ github.sha }}