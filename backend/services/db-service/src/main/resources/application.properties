# Datenbankverbindung
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:postgres}
quarkus.datasource.password=${DB_PASSWORD:postgres}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:demodb}

# Schema automatisch aktualisieren (nur Entwicklung)
quarkus.hibernate-orm.database.generation=update

# Keycloak (Platzhalter, damit OIDC nicht sofort beim Start crasht, falls wir es noch nicht haben)
quarkus.oidc.tenant-enabled=false
# Sobald Keycloak da ist:
# quarkus.oidc.auth-server-url=${KEYCLOAK_URL}/realms/${KEYCLOAK_REALM}
# quarkus.oidc.client-id=${KEYCLOAK_CLIENT_ID}
# quarkus.oidc.application-type=service
