# ai-service: stateless KI-Service hinter POST /ai/process
# Wird von der Process Engine per HTTP-Connector aufgerufen.
# Keine eigene DB (ai-db ist optional - Service kann stateless laufen).
#
# Alle externen URLs/Keys sind über Env-Vars überschreibbar (12-Factor-App-Pattern).
# Die Defaults sind für lokale Entwicklung gedacht.

# ---------- HTTP / Server ----------
# Eigener Port - offer-service nutzt 8080, wir nehmen 8081 um Konflikte zu vermeiden.
quarkus.http.port=${HTTP_PORT:8081}

# ---------- Auth (Keycloak) ----------
# Erstmal deaktiviert. Sobald Keycloak im Setup ist:
#   quarkus.oidc.auth-server-url=${KEYCLOAK_URL}/realms/${KEYCLOAK_REALM}
#   quarkus.oidc.client-id=${KEYCLOAK_CLIENT_ID}
#   quarkus.oidc.application-type=service
quarkus.oidc.tenant-enabled=false

# ---------- Camunda Process Engine ----------
# Basis-URL der Camunda REST API. Wird vom Quarkus REST Client (CamundaMessageClient)
# verwendet, um die ergebnisKI-Message per businessKey an die laufende Prozessinstanz
# zu korrelieren. Beispiel lokal: http://localhost:8080/engine-rest
# In Docker/Portainer ueber CAMUNDA_ENGINE_URL Env-Var ueberschreiben.
camunda.engine.url=${CAMUNDA_ENGINE_URL:http://localhost:8080/engine-rest}
quarkus.rest-client."camunda-engine".url=${camunda.engine.url}
# Robustheit: Timeouts setzen, damit ein langsames Camunda uns nicht ewig blockiert.
quarkus.rest-client."camunda-engine".connect-timeout=5000
quarkus.rest-client."camunda-engine".read-timeout=10000

# ---------- MegaLLM (LLM-Provider) ----------
# Basis-URL und API-Key für MegaLLM.
# WICHTIG: Der API-Key MUSS als Env-Var MEGALLM_API_KEY gesetzt sein -
# NIEMALS einen echten Key in dieser Datei oder im Git-Repo speichern!
# Verwendung in Tickets #538 (LLM-Call 1) und #541 (LLM-Call 2).
# Basis-URL inkl. /v1 (OpenAI-kompatibler Pfad) - gegen /v1/models verifiziert (2026-05-30).
megallm.api.url=${MEGALLM_API_URL:https://ai.megallm.io/v1}
megallm.api.key=${MEGALLM_API_KEY:}
# Default-Modell - Ergebnis der Modellwahl-Eval (#537), bestätigt im Team am 02.06.2026.
megallm.model.default=${MEGALLM_MODEL:gemini-3-flash-preview}
# Fallback-Modell: greift, wenn das Primaermodell endgueltig fehlschlaegt (z.B. MegaLLM-
# seitiges 503 "Resource overloaded", das die ganze Gemini-Familie treffen kann). Default
# gemma (Eval-Zweitplatzierter, andere Modellfamilie -> von der Gemini-Ueberlast unabhaengig).
megallm.model.fallback=${MEGALLM_MODEL_FALLBACK:google-gemma-4-26b}

# REST-Client zum MegaLLM-Endpoint (MegaLlmClient, configKey "megallm").
# Basis-URL = megallm.api.url; @Path("/chat/completions") ergibt den vollen Endpoint.
quarkus.rest-client."megallm".url=${megallm.api.url}
quarkus.rest-client."megallm".connect-timeout=5000
# Grosszuegiger Read-Timeout: ein LLM-Call kann je nach Modell mehrere Sekunden dauern.
quarkus.rest-client."megallm".read-timeout=90000

# ---------- Catalog Service ----------
# URL des catalog-service für die Produktsuche (LLM-Call 2, #540).
# Echter Such-Endpoint steht (PR #701). Umschalten via catalog.mock.enabled=false.
catalog.service.url=${CATALOG_SERVICE_URL:http://localhost:8082}

# Mock-Modus für Catalog: wenn true, nutzt der ai-service den internen Mock-Katalog
# (#539, CatalogSearchService) statt den echten catalog-service aufzurufen.
# Sobald der catalog-service-Such-Endpoint produktiv ist: auf false setzen.
catalog.mock.enabled=${CATALOG_MOCK_ENABLED:true}

# REST-Client zum Such-Endpoint (CatalogSearchClient, configKey "catalog-search").
# Basis-URL = catalog.service.url; @Path("/catalog/material/search") ergibt den vollen Endpoint
# (catalog-service MaterialResource, PR #701). Nur relevant, wenn catalog.mock.enabled=false.
quarkus.rest-client."catalog-search".url=${catalog.service.url}
quarkus.rest-client."catalog-search".connect-timeout=5000
quarkus.rest-client."catalog-search".read-timeout=10000

# ---------- OIDC-Client (technisches Token fuer catalog-Aufrufe, #540) ----------
# Der catalog-service verlangt seit #745 ein JWT. Der ai-service holt sich per
# client_credentials ein technisches Token (Keycloak-Client "ai-service", Rolle
# process-engine) und haengt es via @OidcClientFilter an die catalog-Suche. Den Ziel-
# Handwerker gibt er separat im Header X-Handwerker-Id mit (kommt von der PE als Prozess-
# variable). Nur relevant im Real-Betrieb (catalog.mock.enabled=false).
#
# WICHTIG: AI_SERVICE_OIDC_SECRET MUSS als Env-Var gesetzt sein - NIE ins Repo committen!
# Token-URL OHNE /auth (modernes Keycloak hat kein /auth-Praefix mehr) - per
# KEYCLOAK_AUTH_SERVER_URL ueberschreibbar. Mit /auth liefert der Token-Endpoint 404
# ("Unable to find matching target resource method") -> technisches Token schlaegt fehl.
quarkus.oidc-client.auth-server-url=${KEYCLOAK_AUTH_SERVER_URL:https://id-craftvoice.winfprojekt.de/realms/handwerker-realm}
quarkus.oidc-client.discovery-enabled=false
quarkus.oidc-client.token-path=/protocol/openid-connect/token
quarkus.oidc-client.client-id=${AI_SERVICE_OIDC_CLIENT_ID:ai-service}
quarkus.oidc-client.credentials.secret=${AI_SERVICE_OIDC_SECRET:}
quarkus.oidc-client.grant.type=client
# Token wird LAZY beim ersten catalog-Call geholt (nicht beim Start) - sonst muesste schon
# der Start (auch in Tests / im Mock-Betrieb) ein erreichbares Keycloak voraussetzen.
quarkus.oidc-client.early-tokens-acquisition=false
