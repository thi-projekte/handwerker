# Datenbankverbindung
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:postgres}
quarkus.datasource.password=${DB_PASSWORD:postgres}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:postgres}:5432/${DB_NAME:offer-db}

# Schema automatisch aktualisieren (nur Entwicklung)
quarkus.hibernate-orm.database.generation=update

# HTTP Port (CIB seven belegt 8080)
quarkus.http.port=8081

# Process Engine
process-engine.url=${PE_URL:http://localhost:8080/engine-rest}

# Deepgram Speech-to-Text
deepgram.api-key=${DEEPGRAM_API_KEY:changeme}

# Keycloak (wird später aktiviert sobald Keycloak-Setup abgeschlossen)
quarkus.oidc.tenant-enabled=false
