# Datenbankverbindung
quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.username=${DB_USER:postgres}
%dev.quarkus.datasource.password=${DB_PASSWORD:postgres}
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:postgres}:5432/${DB_NAME:offer-db}

%prod.quarkus.datasource.username=${DB_USER:postgres}
%prod.quarkus.datasource.password=${DB_PASSWORD:postgres}
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:postgres}:5432/${DB_NAME:offer-db}

# Test-Datenbankverbindung (H2 In-Memory)
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=

# Schema automatisch aktualisieren (nur Entwicklung)
quarkus.hibernate-orm.database.generation=update

# HTTP Port (CIB seven belegt 8080)
quarkus.http.port=8080

# Process Engine
process-engine.url=${PE_URL:http://pe-craftvoice.winfprojekt.de}

# Deepgram Speech-to-Text
deepgram.api-key=${DEEPGRAM_API_KEY:changeme}

# Keycloak (vorerst disabled)
quarkus.oidc.tenant-enabled=false

# Quarkus Rest Client: Process Engine
quarkus.rest-client."de.winfprojekt.craftvoice.offerservice.offer.ProcessEngineRestClient".url=${process-engine.url}

# OIDC public endpoint bypass for offer acceptance/rejection (used when quarkus.oidc.tenant-enabled is set to true)
quarkus.http.auth.permission.public-annahme.paths=/angebote/annahme/*
quarkus.http.auth.permission.public-annahme.policy=permit

# User Service
user-service.url=${USER_SERVICE_URL:http://localhost:8082}
quarkus.rest-client."de.winfprojekt.craftvoice.offerservice.user.UserServiceClient".url=${user-service.url}

# CORS Configuration
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization