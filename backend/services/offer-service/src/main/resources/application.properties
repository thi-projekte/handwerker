# Datenbankverbindung
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:postgres}
quarkus.datasource.password=${DB_PASSWORD:postgres}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:postgres}:5432/${DB_NAME:craftvoice-db}

# Schema automatisch aktualisieren (nur Entwicklung)
# Warnung: Nicht fuer Produktivsysteme geeignet
quarkus.hibernate-orm.database.generation=update

# Keycloak (wird spaeter aktiviert sobald Keycloak-Setup abgeschlossen)
quarkus.oidc.tenant-enabled=false
