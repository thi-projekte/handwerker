services:
  catalog-db:
    image: postgres:15
    container_name: catalog-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: catalog-db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U catalog -d catalog-db" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - catalog-internal

  catalog-service:
    # Fertiges Image aus GHCR (von der Backend-CI gebaut, Tag = Branchname, z.B. sprint4).
    # NICHT lokal bauen (build:) - sonst landet ein neuer Commit (z.B. CORS-Fix) nie im
    # laufenden Container, weil "Recreate" das alte lokale Image nur neu startet.
    image: ghcr.io/thi-projekte/handwerker/catalog-service:${IMAGE_TAG:-sprint4}
    container_name: catalog-service
    environment:
      DB_HOST: catalog-db
      DB_NAME: catalog-db
      DB_USER: catalog
      DB_PASSWORD: postgres
      QUARKUS_OIDC_TENANT_ENABLED: "true"
    depends_on:
      catalog-db:
        condition: service_healthy
    networks:
      - catalog-internal
      - nginx-proxy-manager

volumes:
  postgres_data:

networks:
  catalog-internal:
  nginx-proxy-manager:
    external: true
