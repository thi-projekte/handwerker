# Datenbankverbindung
quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.username=${DB_USER:document}
%dev.quarkus.datasource.password=${DB_PASSWORD:postgres}
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:5433/${DB_NAME:document-db}

%prod.quarkus.datasource.username=${DB_USER:document}
%prod.quarkus.datasource.password=${DB_PASSWORD:postgres}
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:document-db}:5432/${DB_NAME:document-db}

%dev.document.auth.enabled=false
%dev.document.dev.owner-id=dev-user

%prod.document.auth.enabled=true
%prod.document.dev.owner-id=dev-user

document.pdf.storage-path=${DOCUMENT_STORAGE_PATH:/data/documents}

# Test-Datenbankverbindung (H2 In-Memory)
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=

# Schema automatisch aktualisieren (nur Entwicklung)
quarkus.hibernate-orm.database.generation=update

# HTTP Port
quarkus.http.port=8080

# Keycloak
quarkus.oidc.tenant-enabled=${QUARKUS_OIDC_TENANT_ENABLED:false}
quarkus.oidc.auth-server-url=${KEYCLOAK_URL:https://id-craftvoice.winfprojekt.de}/realms/handwerker-realm
quarkus.oidc.client-id=mein-frontend
quarkus.oidc.application-type=service

# PDF-Speicher
document.storage.path=${DOCUMENT_STORAGE_PATH:/data/documents}

# User Service
quarkus.rest-client.user-service.url=http://user-service:8080

# CORS Configuration
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization

# Mail
quarkus.mailer.from=${MAIL_FROM:noreply.craftvoice@gmail.com}
quarkus.mailer.host=${MAIL_HOST:smtp.gmail.com}
quarkus.mailer.port=${MAIL_PORT:587}
quarkus.mailer.username=${MAIL_USERNAME:noreply.craftvoice@gmail.com}
quarkus.mailer.password=${MAIL_PASSWORD}
quarkus.mailer.start-tls=REQUIRED
quarkus.mailer.mock=true

# später auf false, dann werden die mails auch verschickt

