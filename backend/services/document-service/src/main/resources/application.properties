# Datenbankverbindung
quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.username=${DB_USER:postgres}
%dev.quarkus.datasource.password=${DB_PASSWORD:postgres}
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:postgres}:5432/${DB_NAME:document-db}

%prod.quarkus.datasource.username=${DB_USER:postgres}
%prod.quarkus.datasource.password=${DB_PASSWORD:postgres}
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:postgres}:5432/${DB_NAME:document-db}

document.pdf.storage-path=${DOCUMENT_STORAGE_PATH:/data/documents}

# Test-Datenbankverbindung (H2 In-Memory)
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=

# Schema automatisch aktualisieren (nur Entwicklung)
quarkus.hibernate-orm.database.generation=update

# HTTP Port
quarkus.http.port=8080

# Keycloak (vorerst disabled)
quarkus.oidc.tenant-enabled=${QUARKUS_OIDC_TENANT_ENABLED:false}

# PDF-Speicher
document.storage.path=${DOCUMENT_STORAGE_PATH:/data/documents}

# Offer Service
offer-service.url=${OFFER_SERVICE_URL:http://offer-service:8080}
quarkus.rest-client."de.winfprojekt.craftvoice.documentservice.common.OfferClient".url=${offer-service.url}

# User Service
user-service.url=${USER_SERVICE_URL:http://user-service:8080}
quarkus.rest-client."de.winfprojekt.craftvoice.documentservice.common.UserClient".url=${user-service.url}

# Process Engine
process-engine.url=${PE_URL:http://process-engine:8080/engine-rest}
quarkus.rest-client."de.winfprojekt.craftvoice.documentservice.common.ProcessEngineClient".url=${process-engine.url}

# CORS Configuration
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization