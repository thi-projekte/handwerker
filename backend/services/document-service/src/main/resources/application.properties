# Datenbankverbindung
%dev.quarkus.datasource.db-kind=h2
%dev.quarkus.datasource.username=sa
%dev.quarkus.datasource.password=
%dev.quarkus.datasource.jdbc.url=jdbc:h2:mem:documentdb;DB_CLOSE_DELAY=-1
%dev.quarkus.hibernate-orm.schema-management.strategy=drop-and-create

%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${DB_USER:document}
%prod.quarkus.datasource.password=${DB_PASSWORD:postgres}
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:document-db}:5432/${DB_NAME:document-db}
%prod.quarkus.hibernate-orm.schema-management.strategy=update

%dev.document.auth.enabled=false
%dev.document.dev.owner-id=dev-user
%test.document.auth.enabled=false
%test.document.dev.owner-id=test-user

%prod.document.auth.enabled=true

document.pdf.storage-path=${DOCUMENT_STORAGE_PATH:/data/documents}

# Test-Datenbankverbindung (H2 In-Memory)
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# HTTP Port
quarkus.http.port=8080

# Keycloak
%dev.quarkus.oidc.tenant-enabled=false
%test.quarkus.oidc.tenant-enabled=false
%prod.quarkus.oidc.tenant-enabled=${QUARKUS_OIDC_TENANT_ENABLED:true}
quarkus.oidc.auth-server-url=${KEYCLOAK_URL:https://id-craftvoice.winfprojekt.de}/realms/handwerker-realm
quarkus.oidc.client-id=mein-frontend
quarkus.oidc.application-type=service

# PDF-Speicher
document.storage.path=${DOCUMENT_STORAGE_PATH:/data/documents}

# User Service
%dev.quarkus.rest-client.user-service.url=${USER_SERVICE_URL:http://localhost:8081}
%prod.quarkus.rest-client.user-service.url=${USER_SERVICE_URL:http://user-service:8080}

# CORS Configuration
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization

# Mail
quarkus.mailer.from=${MAIL_FROM:noreply.craftvoice@gmail.com}
quarkus.mailer.host=${MAIL_HOST:smtp.gmail.com}
quarkus.mailer.port=${MAIL_PORT:587}
quarkus.mailer.username=${MAIL_USERNAME:noreply.craftvoice@gmail.com}
%dev.quarkus.mailer.password=dev-password
%test.quarkus.mailer.password=test-password
%prod.quarkus.mailer.password=${MAIL_PASSWORD}
quarkus.mailer.start-tls=REQUIRED
%dev.quarkus.mailer.mock=true
%test.quarkus.mailer.mock=true
%prod.quarkus.mailer.mock=${MAIL_MOCK:false}


