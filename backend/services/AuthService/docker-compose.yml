services:
  auth-db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER:-auth}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-auth}
      POSTGRES_DB: ${DB_NAME:-auth_db}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_USER: ${DB_USER:-auth}
      DB_PASSWORD: ${DB_PASSWORD:-auth}
      DB_HOST: auth-db
      DB_NAME: ${DB_NAME:-auth_db}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
    depends_on:
      auth-db:
        condition: service_healthy
