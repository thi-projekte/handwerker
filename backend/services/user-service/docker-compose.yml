version: '3.8'

services:
  # 1. Datenbank für den User-Service
  craftvoice-user-db:
    image: postgres:15
    container_name: craftvoice-user-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: user-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - intern

  # 2. Der User-Service (nutzt das fertige Image aus GHCR)
  craftvoice-user-service:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-handwerker}/user-service:main
    container_name: craftvoice-user-service
    environment:
      DB_HOST: craftvoice-user-db
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: user-db
      KEYCLOAK_URL: https://id-craftvoice.winfprojekt.de
      KEYCLOAK_REALM: handwerker-realm
    depends_on:
      craftvoice-user-db:
        condition: service_healthy
    networks:
      - intern

  # 3. Keycloak
  craftvoice-keycloak:
    image: quay.io/keycloak/keycloak:26.2
    container_name: craftvoice-keycloak
    command: start --proxy-headers xforwarded --hostname=id-craftvoice.winfprojekt.de
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://craftvoice-keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_HOSTNAME: id-craftvoice.winfprojekt.de
      KC_HTTP_ENABLED: "true"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    depends_on:
      craftvoice-keycloak-db:
        condition: service_healthy
    networks:
      - intern

  # 4. Datenbank für Keycloak
  craftvoice-keycloak-db:
    image: postgres:16
    container_name: craftvoice-keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - intern

networks:
  # Wir lassen das Netzwerk hier lokal, damit Portainer nicht abstürzt.
  # In Portainer solltest du diesen Stack dem Proxy-Netzwerk hinzufügen.
  intern:
    driver: bridge

volumes:
  keycloak_postgres_data:
