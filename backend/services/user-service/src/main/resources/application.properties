# Database connection
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:postgres}
quarkus.datasource.password=${DB_PASSWORD:postgres}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:postgres}:5432/${DB_NAME:user-db}

# Hibernate ORM
quarkus.hibernate-orm.database.generation=update

# HTTP Port
quarkus.http.port=8082

# Keycloak OIDC (Token Verification)
quarkus.oidc.auth-server-url=${KEYCLOAK_URL:http://localhost:8080}/realms/handwerker-realm
quarkus.oidc.client-id=user-service
quarkus.oidc.credentials.secret=secret

# Keycloak Admin Client (User Management)
quarkus.keycloak.admin-client.server-url=${KEYCLOAK_URL:http://localhost:8080}
quarkus.keycloak.admin-client.realm=master
quarkus.keycloak.admin-client.client-id=admin-cli
quarkus.keycloak.admin-client.username=admin
quarkus.keycloak.admin-client.password=admin
quarkus.keycloak.admin-client.grant-type=password

# Mailer (Mocked, Keycloak handles real mail)
quarkus.mailer.mock=true

# Logging
quarkus.log.level=INFO
quarkus.log.category."de.winfprojekt.craftvoice.userservice".level=DEBUG
