# Database - Use H2 In-Memory for CI Tests
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=

# Hibernate
quarkus.hibernate-orm.database.generation=drop-and-create

# Security - Keep OIDC enabled so the JsonWebToken bean exists, 
# but disable the tenant so it doesn't try to contact Keycloak.
quarkus.oidc.tenant-enabled=false
quarkus.http.auth.permission.authenticated.paths=/*
quarkus.http.auth.permission.authenticated.policy=authenticated

# Keycloak Admin Client - Mock URL
quarkus.keycloak.admin-client.server-url=http://localhost:8081
quarkus.keycloak.admin-client.realm=master

# Logging
quarkus.log.level=INFO
