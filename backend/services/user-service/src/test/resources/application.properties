# Database - Use H2 In-Memory for CI Tests
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=

# Hibernate
quarkus.hibernate-orm.database.generation=drop-and-create

# Security - Disable OIDC during tests to avoid connection errors to Keycloak
quarkus.oidc.enabled=false
quarkus.oidc.tenant-enabled=false

# Keycloak Admin Client - Mock URL
quarkus.keycloak.admin-client.server-url=http://localhost:8081
quarkus.keycloak.admin-client.realm=master

# Logging
quarkus.log.level=INFO
