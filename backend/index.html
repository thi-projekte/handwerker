<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CraftVoice Catalog</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0f172a;
            color: white;
            padding: 40px;
        }

        h1 {
            margin-bottom: 30px;
            font-size: 32px;
        }

        .container {
            display: flex;
            gap: 40px;
            align-items: flex-start;
        }

        .card {
            background: #1e293b;
            padding: 25px;
            border-radius: 14px;
            width: 420px;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
        }

        .card h2 {
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #cbd5e1;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: #334155;
            color: white;
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            cursor: pointer;
            margin-top: 12px;
            transition: 0.2s;
        }

        button:hover {
            background: #1d4ed8;
        }

        .materials {
            margin-top: 20px;
        }

        .material-card {
            background: #334155;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .material-card h3 {
            margin-bottom: 8px;
        }

        .material-card p {
            margin-bottom: 5px;
            color: #cbd5e1;
        }

        .success {
            margin-top: 15px;
            color: #4ade80;
        }

        .error {
            margin-top: 15px;
            color: #f87171;
        }

    </style>
</head>
<body>

<h1>CraftVoice Catalog Service</h1>

<div class="container">

    <div class="card">

        <h2>Material erstellen</h2>

        <div class="form-group">
            <label>Artikelnummer</label>
            <input id="articleNumber" type="text">
        </div>

        <div class="form-group">
            <label>Name</label>
            <input id="name" type="text">
        </div>

        <div class="form-group">
            <label>Beschreibung</label>
            <textarea id="description"></textarea>
        </div>

        <div class="form-group">
            <label>Lieferant</label>
            <input id="supplierName" type="text">
        </div>

        <div class="form-group">
            <label>Kategorie</label>
            <input id="categoryName" type="text">
        </div>

        <div class="form-group">
            <label>Netto Preis</label>
            <input id="priceNet" type="number" step="0.01">
        </div>

        <div class="form-group">
            <label>Brutto Preis</label>
            <input id="priceGross" type="number" step="0.01">
        </div>

        <div class="form-group">
            <label>MwSt</label>
            <input id="vatRate" type="number" step="0.01">
        </div>

        <button onclick="createMaterial()">
            Material speichern
        </button>

        <div id="status"></div>

    </div>

    <div class="card">

        <h2>Materialien</h2>

        <button onclick="loadMaterials()">
            Materialien anzeigen
        </button>

        <div class="materials" id="materials"></div>

    </div>

    <div class="card">

        <h2>CSV Import</h2>

        <div class="form-group">
            <label>CSV Datei auswählen</label>
            <input id="csvFile" type="file" accept=".csv">
        </div>

        <button onclick="importCsv()">
            CSV importieren
        </button>

        <div id="csvStatus"></div>

    </div>

</div>

<script>

    async function createMaterial() {

        const material = {
            articleNumber: document.getElementById("articleNumber").value,
            name: document.getElementById("name").value,
            description: document.getElementById("description").value,

            supplierNumber: "",
            supplierName: document.getElementById("supplierName").value,

            categoryCode: "",
            categoryName: document.getElementById("categoryName").value,

            unit: "ST",

            priceNet: parseFloat(document.getElementById("priceNet").value || 0),
            priceGross: parseFloat(document.getElementById("priceGross").value || 0),
            vatRate: parseFloat(document.getElementById("vatRate").value || 0),

            currency: "EUR"
        };

        try {

            const response = await fetch("/catalog/material", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(material)
            });

            if (!response.ok) {
                throw new Error("Fehler beim Speichern");
            }

            document.getElementById("status").innerHTML =
                '<div class="success">Material erfolgreich gespeichert</div>';

        } catch (e) {

            document.getElementById("status").innerHTML =
                '<div class="error">Fehler beim Speichern</div>';
        }
    }

    async function loadMaterials() {

        const container = document.getElementById("materials");

        container.innerHTML = "";

        const response = await fetch("/catalog/material");

        const materials = await response.json();

        materials.forEach(material => {

            container.innerHTML += `
        <div class="material-card">

            <h3>${material.name}</h3>

            <p><strong>ID:</strong> ${material.id}</p>
            <p><strong>Artikelnummer:</strong> ${material.articleNumber}</p>
            <p><strong>Beschreibung:</strong> ${material.description}</p>
            <p><strong>Kategorie:</strong> ${material.categoryName}</p>
            <p><strong>Lieferant:</strong> ${material.supplierName}</p>
            <p><strong>Preis Netto:</strong> ${material.priceNet} €</p>
            <p><strong>Preis Brutto:</strong> ${material.priceGross} €</p>

            <button onclick="deleteMaterial('${material.id}')">
                Material deaktivieren
            </button>

        </div>
    `;
        });
    }

    async function deleteMaterial(id) {

        const confirmed = confirm("Material wirklich deaktivieren?");

        if (!confirmed) {
            return;
        }

        try {
            const response = await fetch(`/catalog/material/${id}`, {
                method: "DELETE"
            });

            if (!response.ok) {
                throw new Error("Fehler beim Deaktivieren");
            }

            await loadMaterials();

        } catch (e) {
            alert("Material konnte nicht deaktiviert werden");
            console.error(e);
        }
    }

    async function importCsv() {

        const status = document.getElementById("csvStatus");
        const fileInput = document.getElementById("csvFile");

        status.innerHTML = "";

        if (fileInput.files.length === 0) {
            status.innerHTML = '<div class="error">Bitte eine CSV Datei auswählen</div>';
            return;
        }

        const file = fileInput.files[0];

        console.log("CSV Upload Start");
        console.log("Dateiname:", file.name);
        console.log("Dateigröße:", file.size);
        console.log("Dateityp:", file.type);

        const formData = new FormData();
        formData.append("file", file);

        try {
            const response = await fetch("/catalog/material/import/csv", {
                method: "POST",
                body: formData
            });

            const responseText = await response.text();

            console.log("HTTP Status:", response.status);
            console.log("Response OK:", response.ok);
            console.log("Response Text:", responseText);

            if (!response.ok) {
                status.innerHTML = `
                <div class="error">
                    <strong>CSV Import fehlgeschlagen</strong><br>
                    Status: ${response.status}<br>
                    Antwort: ${responseText}
                </div>
            `;
                return;
            }

            status.innerHTML = `
            <div class="success">
                CSV Import erfolgreich<br>
                Importiert: ${responseText}
            </div>
        `;

            await loadMaterials();

        } catch (e) {
            console.error("Fetch Fehler:", e);

            status.innerHTML = `
            <div class="error">
                <strong>Fetch-Fehler</strong><br>
                ${e.message}
            </div>
        `;
        }
    }

</script>

</body>
</html>
