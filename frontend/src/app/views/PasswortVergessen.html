<!doctype html>
<html lang="de" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Passwort vergessen</title>
  <link rel="stylesheet" href="/src/features/formBuilder/components/stylesheets/stylesheet.css" />
</head>

<body>
<div class="app">
  <div class="card reset-card">
    
    <h1>Passwort zurücksetzen</h1>

    </p>

    <div class="divider"></div>

    <input class="input-field" type="email" placeholder="E-Mail-Adresse" />

    <button class="button-primary reset-btn">
      Passwort zurücksetzen
    </button>

    <div class="reset-footer">
      <a href="#" class="text-secondary">Zurück zum Login</a>
    </div>

  </div>
</div>

</html>
